name: "Build"

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download goboscript compiler
        uses: dsaltares/fetch-gh-release-asset@v1
        with:
          repo: IMG-F/goboscript
          file: goboscript-x86_64-unknown-linux-gnu
          target: goboscript-compiler
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make compiler executable
        run: chmod +x goboscript-compiler

      - name: Build project
        run: |
          ./goboscript-compiler build

      - name: Upload sb3 to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.sb3"
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
